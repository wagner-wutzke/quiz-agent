spring:
  application:
    name: interview-coach
    interview-topic: ${APP_INTERVIEW_TOPIC:Salesforce Technical Architect}
    questions-file-location: classpath:questions/questions-answers.xlsx

  devtools:
    restart:
      enabled: true

  ai:
    openai:
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}
        reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASEURL:https://api.openai.com/v1}

    model:
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:file:./data/quiz-agent-db}
    driver-class-name: ${DATASOURCE_DRIVER_CLASS:org.h2.Driver}
    username: ${DATASOUCE_USERNAME:sa}
    password: ${DATASOUCE_PASSWORD:}

  sql.init.mode: always
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings:
        web-allow-others: ${H2_CONSOLE_WEB_ALLOW_OTHERS:true}

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: ${OPENAI_CHAT_LOGLEVEL:INFO}